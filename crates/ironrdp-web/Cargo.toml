[package]
name = "ironrdp-web"
version = "0.0.0"
readme = "README.md"
description = "WebAssembly high-level bindings targeting web browsers"
publish = false
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
doctest = false
test = false
crate-type = ["cdylib", "rlib"]

[features]
default = ["panic_hook"]
panic_hook = ["iron-remote-desktop/panic_hook"]
qoi = ["ironrdp/qoi"]
qoiz = ["ironrdp/qoiz"]

[dependencies]
# Protocols
ironrdp = { path = "../ironrdp", features = [
    "connector",
    "session",
    "input",
    "graphics",
    "dvc",
    "cliprdr",
    "rdpdr",
    "rdpsnd",
    "svc",
    "displaycontrol",
    "pdu",
] }
ironrdp-core.path = "../ironrdp-core"
ironrdp-cliprdr-format.path = "../ironrdp-cliprdr-format"
ironrdp-futures.path = "../ironrdp-futures"
ironrdp-pdu.path = "../ironrdp-pdu"
ironrdp-propertyset.path = "../ironrdp-propertyset"
ironrdp-rdpfile.path = "../ironrdp-rdpfile"
ironrdp-svc.path = "../ironrdp-svc"
ironrdp-vmconnect.path = "../ironrdp-vmconnect"
iron-remote-desktop.path = "../iron-remote-desktop"

# WASM
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "CanvasRenderingContext2d",
    "File",
    "FileSystemCreateWritableOptions",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemHandle",
    "FileSystemRemoveOptions",
    "FileSystemWritableFileStream",
    "HtmlCanvasElement",
    "ImageData",
    "Navigator",
    "Performance",
    "Window",
    "WritableStream",
] }
js-sys = "0.3"
gloo-net = { version = "0.7", default-features = false, features = ["websocket", "http", "io-util"] }

# TLS, terminated in the browser (see `crate::tls`). `ring` rather than rustls'
# default `aws-lc-rs`, which does not build for `wasm32-unknown-unknown`.
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = { version = "1.15", features = ["web"] }
# `ring`'s `SystemRandom` has no implementation on `wasm32-unknown-unknown` unless this
# feature routes it through `getrandom`'s JS backend (`crypto.getRandomValues`).
ring = { version = "0.17.14", features = ["wasm32_unknown_unknown_js"] }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
gloo-timers = { version = "0.4", default-features = false, features = ["futures"] }

# Rendering
png = "0.18"
resize = { version = "0.8", features = ["std"], default-features = false }
rgb = "0.8"

# Enable WebAssembly support for a few crates
getrandom2 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom4 = { package = "getrandom", version = "0.4", features = ["wasm_js"] } # sspi/picky transitive dep
chrono = { version = "0.4", features = ["wasmbind"] }
time = { version = "0.3", features = ["wasm-bindgen"] }

# Async
futures-util = { version = "0.3", features = ["sink", "io"] }
futures-channel = "0.3"

# Logging
tracing = { version = "0.1", features = ["log"] }

# Utils
anyhow = "1"
smallvec = "1.15"
tap = "1"
semver = "1"
url = "2.5"
base64 = "0.22"

[dev-dependencies]
# Native-only test executor for `drive::backend`'s injected-spawner tests
# (`futures::executor::LocalPool` + `futures::task::LocalSpawnExt`); the wasm build itself only
# ever uses `wasm_bindgen_futures::spawn_local`.
futures = { version = "0.3", default-features = false, features = ["executor"] }

[lints]
workspace = true
